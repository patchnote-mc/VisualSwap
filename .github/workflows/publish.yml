# Publish a release to Modrinth, CurseForge, and GitHub Releases.
# Triggered when a *-main branch is updated (e.g. merging <mc>-v<ver>-staging
# into <mc>-v<ver>-main). Game versions, loaders and dependencies are detected
# automatically from src/main/resources/fabric.mod.json, so this file is the
# same on every -main branch. The mod environment is mirrored onto the Modrinth
# project from the same file (see "sync modrinth environment" below).
#
# Duplicate protection is two-layered: version-guard.yml blocks the staging->main
# PR when the version already exists, and this workflow ALSO hard-fails (it never
# republishes or overwrites) if the version is already on Modrinth. Bump
# mod_version before merging to release.
#
# github-commitish pins the created tag to THIS branch's commit. Without it
# mc-publish defaults to the repository default branch, so tags for non-default
# branches (e.g. 26.1.2) would be planted on the wrong commit.
#
# Escape hatch: include "[skip publish]" in the merge/push commit message to land
# changes on a *-main branch without cutting a release. merge_main.sh --skip-publish
# stamps this into the merge commit. Remove the marker (or push normally) to publish.

name: publish
on:
  push:
    branches:
      - '*-main'

permissions:
  contents: write

env:
  # TODO: replace with the Visual Swap Modrinth + CurseForge project IDs
  # (create the projects first, then paste their IDs here). One project per
  # platform serves every Minecraft version.
  MODRINTH_ID: nx3AGjVg
  CURSEFORGE_ID: '1595322'

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build

      - name: resolve version and check if it already exists
        id: check
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          full="v${ver}+mc-${mc}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          id=$(curl -s "https://api.modrinth.com/v2/project/${MODRINTH_ID}/version" \
            | jq -r --arg v "$full" 'map(select(.version_number == $v)) | .[0].id // empty')
          if [ -n "$id" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: fail if version already published
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "::error::${{ steps.check.outputs.full }} is already published on Modrinth - refusing to publish a duplicate. Bump mod_version in gradle.properties before merging to main."
          exit 1

      - name: publish to modrinth, curseforge and github releases
        if: steps.check.outputs.exists == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.check.outputs.full }}
          github-commitish: ${{ github.sha }}
          version-type: release
          # CurseForge requires a concrete game version; auto-detection from the
          # fabric.mod.json minecraft range can resolve to none, so pass it (and
          # the loader) explicitly from gradle.properties.
          loaders: fabric
          game-versions: ${{ steps.check.outputs.mc }}

      # mc-publish has no environment input: Modrinth's client_side/server_side
      # are project fields (PATCH /project), not version fields, and mc-publish
      # never sends CurseForge's environment tag. Mirror fabric.mod.json onto the
      # Modrinth project so the two can't drift. CurseForge's Client tag has no
      # API path through mc-publish - set it by hand on the uploaded file.
      # Idempotent; PATCH needs a token with the "Write projects" scope.
      - name: sync modrinth environment
        if: steps.check.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          case "$(jq -r '.environment // "*"' src/main/resources/fabric.mod.json)" in
            client) client=required;    server=unsupported ;;
            server) client=unsupported; server=required ;;
            '*')    client=required;    server=required ;;
            *)
              echo "::error::unrecognized fabric.mod.json environment"
              exit 1 ;;
          esac
          echo "setting client_side=$client server_side=$server"
          curl -fsS -X PATCH \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"client_side\":\"${client}\",\"server_side\":\"${server}\"}" \
            "https://api.modrinth.com/v2/project/${MODRINTH_ID}"
