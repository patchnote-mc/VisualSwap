# Blocks merging <mc>-v<ver>-staging into <mc>-v<ver>-main when the resulting
# version (v<mod_version>+mc-<minecraft_version>) has already been released -
# i.e. its git tag already exists. Prevents accidental duplicate publishes.
#
# Enforced as a REQUIRED status check on the *-main ruleset, so it must be green to
# merge. The version only matters when we actually publish, so the guard step is
# SKIPPED (and the job therefore reports green) when the PR title contains
# "[skip publish]" - the same marker that skips publish.yml. merge_main.sh
# --skip-publish sets it on both the PR title and the merge commit.

name: version guard
on:
  pull_request:
    branches:
      - '*-main'
    types: [opened, synchronize, reopened, edited]

jobs:
  guard:
    name: block duplicate version
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fail if version already released
        if: ${{ !contains(github.event.pull_request.title, '[skip publish]') }}
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          full="v${ver}+mc-${mc}"
          echo "checking whether $full is already released..."
          if git ls-remote --exit-code --tags origin "refs/tags/$full" >/dev/null 2>&1; then
            echo "::error::$full is already released (its tag exists). Bump mod_version in gradle.properties before merging to main."
            exit 1
          fi
          echo "$full is new - ok to merge."
